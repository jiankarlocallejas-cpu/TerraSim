name: Desktop tests

on:
  push:
    branches: [main, develop, qt-desktop-rebuild]
    paths:
      - "backend/services/**"
      - "desktop/**"
      - "tests/**"
      - "tools/benchmark_flux_kernel.py"
      - "terrasim.py"
      - "requirements-desktop.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/services/**"
      - "desktop/**"
      - "tests/**"
      - "tools/benchmark_flux_kernel.py"
      - "terrasim.py"
      - "requirements-desktop.txt"
      - ".github/workflows/tests.yml"

jobs:
  desktop-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop, routing, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt scipy pytest pytest-cov
      - name: Run desktop and reference tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
