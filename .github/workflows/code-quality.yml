name: Code Quality

on:
  push:
    branches: [main, develop, qt-desktop-rebuild]
    paths:
      - "backend/services/__init__.py"
      - "backend/services/dinf_routing.py"
      - "backend/services/paper_model.py"
      - "backend/services/raster_inputs.py"
      - "backend/services/run_manifest.py"
      - "desktop/**"
      - "tests/**"
      - "tools/benchmark_flux_kernel.py"
      - "terrasim.py"
      - ".github/workflows/code-quality.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/services/__init__.py"
      - "backend/services/dinf_routing.py"
      - "backend/services/paper_model.py"
      - "backend/services/raster_inputs.py"
      - "backend/services/run_manifest.py"
      - "desktop/**"
      - "tests/**"
      - "tools/benchmark_flux_kernel.py"
      - "terrasim.py"
      - ".github/workflows/code-quality.yml"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Check active desktop and model code
        run: >-
          ruff check
          backend/services/__init__.py
          backend/services/dinf_routing.py
          backend/services/paper_model.py
          backend/services/raster_inputs.py
          backend/services/run_manifest.py
          desktop
          tests
          tools/benchmark_flux_kernel.py
          terrasim.py
