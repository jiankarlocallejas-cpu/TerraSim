[package]
name = "terrasim-compute"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Optional Rust kernels for TerraSim's terrain reference model"
license = "MIT"

[lib]
name = "terrasim_compute"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python-extension"]
python-extension = ["dep:numpy", "dep:pyo3"]

[dependencies]
numpy = { version = "0.30.0", optional = true }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

